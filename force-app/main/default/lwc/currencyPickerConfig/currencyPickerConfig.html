<template>
    <div class="cpe">
        <div class="field">
            <span class="field__label">Available currencies</span>
            <p class="field__help">
                Currencies the payer can choose from. Leave empty to offer a single default currency.
            </p>
            <lightning-dual-listbox
                variant="label-hidden"
                name="allowedCurrencies"
                label="Available currencies"
                source-label="Available"
                selected-label="Offered"
                options={currencyOptions}
                value={allowedValue}
                onchange={handleAllowedChange}>
            </lightning-dual-listbox>
        </div>

        <div class="field">
            <span class="field__label">Default currency</span>
            <p class="field__help">
                Currency shown when the form loads. Must be one of the available currencies.
            </p>
            <lightning-combobox
                variant="label-hidden"
                name="defaultCurrency"
                label="Default currency"
                placeholder="Select a default"
                options={defaultOptions}
                value={defaultValue}
                disabled={defaultDisabled}
                onchange={handleDefaultChange}>
            </lightning-combobox>
        </div>

        <div class="field">
            <span class="field__label">Default currency source</span>
            <p class="field__help">
                Where the initial currency comes from when the form loads.
            </p>
            <lightning-combobox
                variant="label-hidden"
                name="currencySource"
                label="Default currency source"
                options={sourceOptions}
                value={sourceValue}
                onchange={handleSourceChange}>
            </lightning-combobox>
        </div>
    </div>
</template>
